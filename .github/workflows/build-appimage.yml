name: build-appimage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install JS deps
        run: npm install

      - name: Build AppImage
        run: npx tauri build --bundles appimage,deb

      - name: Strip libwayland-* from the AppImage and repack
        # The bundled libwayland-* clash with the host's graphics stack on
        # Wayland desktops; the host's own copies are used once they are gone.
        run: |
          sudo apt-get install -y squashfs-tools
          for img in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash scripts/strip-appimage-wayland.sh "$img"
          done

      - name: Assert no libwayland-* remains in the final AppImage
        # Independent of the strip script: unpack the finished image and look.
        run: |
          set -eu
          img=$(ls "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          rm -rf /tmp/appimage-final && mkdir -p /tmp/appimage-final && cd /tmp/appimage-final
          "$img" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun || { echo "AppRun missing or not executable after repack"; exit 1; }
          found=$(find squashfs-root \( -type f -o -type l \) -name 'libwayland-*')
          if [ -n "$found" ]; then
            echo "libwayland-* still present in the AppImage:"; echo "$found"; exit 1
          fi
          echo "OK: unpacked $(find squashfs-root -type f | wc -l) files, none match libwayland-*"

      - name: Smoke-launch the AppImage several ways (X11, virtual display)
        # Diagnostic only, NOT a Wayland test: it prints, per launch variant,
        # whether the app stayed up, spawned a WebKit web process and painted
        # something other than a blank window. It never fails the build.
        # Known limitation: on the CI runner every variant (including the
        # workaround turned off) shows no web process and a blank window, so
        # this cannot validate the Wayland fix; it only confirms that the
        # variables are applied (see the 'APP SAID' column).
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb imagemagick
          img=$(ls "$GITHUB_WORKSPACE"/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          bash scripts/appimage-smoke.sh "$img"

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uni-staller-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      # Optional: attach to a GitHub Release when you push a tag like v1.0.0
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
