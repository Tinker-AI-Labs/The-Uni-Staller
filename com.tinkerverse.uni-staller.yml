app-id: com.tinkerverse.uni-staller
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: uni-staller
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=dri
  - --filesystem=home

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/uni-staller/cargo

modules:
  - name: uni-staller
    buildsystem: simple
    build-commands:
      - npm install --offline --cache=./npm-cache
      - npm run tauri build -- --bundles deb
      - install -Dm755 src-tauri/target/release/uni-staller /app/bin/uni-staller
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.tinkerverse.uni-staller.png
      - install -Dm644 packaging/com.tinkerverse.uni-staller.desktop /app/share/applications/com.tinkerverse.uni-staller.desktop
      - install -Dm644 packaging/com.tinkerverse.uni-staller.metainfo.xml /app/share/metainfo/com.tinkerverse.uni-staller.metainfo.xml
    sources:
      - type: git
        url: https://github.com/Tinker-AI-Labs/The-Uni-Staller.git
        branch: main
      # Generated in CI — see build-flatpak.yml. Paths are relative to the
      # source root once the git source above is checked out.
      - generated-sources.json       # cargo deps, from flatpak-cargo-generator.py
      - generated-sources-npm.json   # npm deps, from flatpak-node-generator.py
