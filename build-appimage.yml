name: build-appimage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install JS deps
        run: npm install

      - name: Build AppImage (x86_64)
        run: npx tauri build --bundles appimage,deb

      - name: Upload AppImage as artifact
        uses: actions/upload-artifact@v4
        with:
          name: uni-staller-appimage-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

      - name: Create Release (x86_64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-aarch64:
    # Native GitHub-hosted ARM64 runner. No cross-compilation needed here:
    # cross-compiling WebKitGTK/GTK with a multiarch apt toolchain requires
    # arm64 packages that aren't reachable without adding a ports.ubuntu.com
    # source, plus PKG_CONFIG_ALLOW_CROSS for the Rust build — building
    # natively on real arm64 hardware sidesteps all of that.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libssl-dev pkg-config

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install JS deps
        run: npm install

      - name: Build AppImage (aarch64)
        run: npx tauri build --bundles appimage,deb

      - name: Rename artifacts for aarch64
        run: |
          cd src-tauri/target/release/bundle
          for f in appimage/*.AppImage; do [ -f "$f" ] && mv "$f" "${f%.AppImage}-aarch64.AppImage"; done
          for f in deb/*.deb; do [ -f "$f" ] && mv "$f" "${f%.deb}-aarch64.deb"; done

      - name: Upload AppImage as artifact (aarch64)
        uses: actions/upload-artifact@v4
        with:
          name: uni-staller-appimage-aarch64
          path: |
            src-tauri/target/release/bundle/appimage/*-aarch64.AppImage
            src-tauri/target/release/bundle/deb/*-aarch64.deb

      - name: Create Release (aarch64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/release/bundle/appimage/*-aarch64.AppImage
            src-tauri/target/release/bundle/deb/*-aarch64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
